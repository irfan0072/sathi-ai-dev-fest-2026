end": 110, "caption": "A separate 3,000 BDT request with customer confirmation 2,500 stays requested after the first mismatch and is rejected after the second. Cases 6 and 7 are saved for human review."}, {"start": 110, "end": 130, "caption": "The analyst reviews actual PostgreSQL cases. Escalating cash-gap case 5 is recorded in the audit. Human review and model scores never grant redemption. Startup preserves spent balances and cases."}, {"start": 130, "end": 150, "caption": "Outreach displays saved synthetic predictions with frozen provenance and SHAP reasons in raw log-odds. Agent risks use observed signals and train-derived volume peers; scores are review priorities, not proven fraud."}, {"start": 150, "end": 180, "caption": "Held-out assisted PR-AUC: model 0.8091, rule 0.6967. Agent ensemble: 2/2 skimmers, 0/4 honest high-volume false flags; precision at 15 is 2/15. Shifted Isolation Forest falsely flags 3/4; subtle skimmers are missed. Idealized adoption is not measured field benefit."}];const video=document.getElementById('video');const caption=document.getElementById('caption');function update(){caption.textContent=(scenes.find(s=>video.currentTime>=s.start&&video.currentTime<s.end)||scenes[scenes.length-1]).caption;}video.addEventListener('timeupdate',update);update();</script></html>
