services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-sathi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sathi} -d ${POSTGRES_DB:-sathi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sathi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sathi}
      JWT_SECRET: ${JWT_SECRET:?Run make init-env to create a valid ignored signing secret}
      SATHI_CONFIG: ${SATHI_CONFIG:-data/config.yaml}
      SATHI_ARTIFACTS_DIR: data/artifacts/deployment
      SATHI_INTELLIGENCE_DIR: data/artifacts/intelligence
      SATHI_VOICE_PROVIDER: ${SATHI_VOICE_PROVIDER:-simulated}
      SATHI_PUBLIC_API_URL: ${SATHI_PUBLIC_API_URL:-}
      SATHI_VOICE_PHONE_BOOK: ${SATHI_VOICE_PHONE_BOOK:-}
      SATHI_STEP_UP_ENFORCED: ${SATHI_STEP_UP_ENFORCED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SATHI_BD_IVR_BASE_URL: ${SATHI_BD_IVR_BASE_URL:-}
      SATHI_BD_IVR_API_KEY: ${SATHI_BD_IVR_API_KEY:-}
      SATHI_BD_IVR_WEBHOOK_SECRET: ${SATHI_BD_IVR_WEBHOOK_SECRET:-}
      SATHI_BD_IVR_LANGUAGE: ${SATHI_BD_IVR_LANGUAGE:-bn-BD}
      SATHI_SMS_PROVIDER: ${SATHI_SMS_PROVIDER:-simulated}
      SATHI_SETTINGS_EDITABLE: ${SATHI_SETTINGS_EDITABLE:-true}
      SATHI_SECRETS_KEY: ${SATHI_SECRETS_KEY:-}
      ALPHA_SMS_API_KEY: ${ALPHA_SMS_API_KEY:-}
      ALPHA_SMS_SENDER_ID: ${ALPHA_SMS_SENDER_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SATHI_GEMINI_MODEL: ${SATHI_GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SATHI_OPENAI_MODEL: ${SATHI_OPENAI_MODEL:-gpt-4o}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13000}:80"
    depends_on:
      - api

  # Local stand-in for the Bangladesh JSON IVR vendor. Used ONLY by live
  # integration tests to roundtrip the Sathi API's bd_http_ivr webhook
  # contract without depending on a real (unconfirmed) vendor. Started only
  # when the user runs `docker compose --profile live up`. Default behavior
  # is unchanged.
  bd_ivr_standin:
    image: python:3.13-slim
    restart: "no"
    profiles: ["live"]
    working_dir: /srv
    command: ["python", "bd_ivr_standin.py", "--host", "0.0.0.0", "--port", "18443"]
    environment:
      SATHI_BD_IVR_API_KEY: ${SATHI_BD_IVR_API_KEY:-demo-bd-ivr-api-key-for-live-integration-only-please-rotate}
      SATHI_BD_IVR_WEBHOOK_SECRET: ${SATHI_BD_IVR_WEBHOOK_SECRET:-demo-bd-ivr-webhook-secret-please-rotate-16-chars-min}
      SATHI_BD_IVR_STANDIN_SCENARIO: ${SATHI_BD_IVR_STANDIN_SCENARIO:-digits}
      SATHI_BD_IVR_CALL_DELAY: ${SATHI_BD_IVR_CALL_DELAY:-0.5}
    volumes:
      - ./scripts/bd_ivr_standin.py:/srv/bd_ivr_standin.py:ro
    ports:
      - "127.0.0.1:${BD_IVR_STANDIN_PORT:-18443}:18443"
    # The stand-in only needs the python interpreter; install httpx/uvicorn
    # at runtime so the image stays tiny and we do not pin new dependencies
    # in the main backend Dockerfile.
    entrypoint: ["sh", "-c", "pip install --quiet --no-cache-dir 'fastapi>=0.110.0' 'uvicorn[standard]>=0.28.0' 'httpx>=0.27.0' && exec \"$@\"", "--"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; r=urllib.request.urlopen(\"http://127.0.0.1:18443/health\",timeout=2); sys.exit(0 if r.status==200 else 1)'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
