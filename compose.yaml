services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-sathi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sathi} -d ${POSTGRES_DB:-sathi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sathi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sathi}
      JWT_SECRET: ${JWT_SECRET:?Run make init-env to create a valid ignored signing secret}
      SATHI_CONFIG: ${SATHI_CONFIG:-data/config.yaml}
      SATHI_ARTIFACTS_DIR: data/artifacts/deployment
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
