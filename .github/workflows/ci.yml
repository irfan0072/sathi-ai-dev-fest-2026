name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sathi
          POSTGRES_PASSWORD: CHANGE_ME
          POSTGRES_DB: sathi_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sathi -d sathi_phase1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SATHI_TEST_DATABASE_URL: postgresql://sathi:CHANGE_ME@127.0.0.1:5432/sathi_phase1_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --upgrade pip
          if [ -f backend/requirements-dev.lock ]; then
            .venv/bin/pip install -c backend/requirements-dev.lock -e "backend[dev]"
          else
            .venv/bin/pip install -e "backend[dev]"
          fi

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run test suite
        run: make test

      - name: Run lint suite
        run: make lint

      - name: Build frontend console
        run: make build-console

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
