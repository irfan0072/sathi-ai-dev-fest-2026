# Render Blueprint for Sathi
# Automatic multi-service deployment: Managed Postgres, FastAPI Backend, React Console
databases:
  - name: sathi-db
    databaseName: sathi
    user: sathi
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: sathi-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -c backend/requirements-dev.lock -r backend/requirements.txt"
    startCommand: "PYTHONPATH=backend python -m app.bootstrap"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        fromDatabase:
          name: sathi-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SATHI_CONFIG
        value: "data/config.yaml"
      - key: SATHI_ARTIFACTS_DIR
        value: "data/artifacts/deployment"
      - key: JWT_SECRET
        generateValue: true
      - key: SATHI_INTELLIGENCE_DIR
        value: "data/artifacts/intelligence"
      # Live verification calls. Set SATHI_VOICE_PROVIDER=twilio after adding credentials.
      - key: SATHI_VOICE_PROVIDER
        value: "simulated"
      - key: SATHI_PUBLIC_API_URL
        sync: false
      - key: SATHI_VOICE_PHONE_BOOK
        sync: false
      - key: SATHI_STEP_UP_ENFORCED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Bangladesh JSON IVR gateway (SATHI_VOICE_PROVIDER=bd_http_ivr).
      - key: SATHI_BD_IVR_BASE_URL
        sync: false
      - key: SATHI_BD_IVR_API_KEY
        sync: false
      - key: SATHI_BD_IVR_WEBHOOK_SECRET
        sync: false
      - key: SATHI_SMS_PROVIDER
        value: "simulated"
      - key: ALPHA_SMS_API_KEY
        sync: false
      - key: ALPHA_SMS_SENDER_ID
        sync: false
      # AI investigation assistant: Gemini first, OpenAI fallback, template if neither.
      - key: GEMINI_API_KEY
        sync: false
      - key: SATHI_GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: OPENAI_API_KEY
        sync: false
      - key: SATHI_OPENAI_MODEL
        value: "gpt-4o"

  - type: web
    name: sathi-console
    runtime: static
    buildCommand: "npm --prefix frontend ci && npm --prefix frontend run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"
      - key: VITE_API_URL
        sync: false
