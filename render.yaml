# Render Blueprint for Sathi
# Automatic multi-service deployment: Managed Postgres, FastAPI Backend, React Console
databases:
  - name: sathi-db
    databaseName: sathi
    user: sathi
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: sathi-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -c backend/requirements-dev.lock -r backend/requirements.txt"
    startCommand: "PYTHONPATH=backend python -m app.bootstrap"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        fromDatabase:
          name: sathi-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SATHI_CONFIG
        value: "data/config.yaml"
      - key: SATHI_ARTIFACTS_DIR
        value: "data/artifacts/deployment"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: sathi-console
    runtime: static
    buildCommand: "npm --prefix frontend ci && npm --prefix frontend run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"
      - key: VITE_API_URL
        sync: false
