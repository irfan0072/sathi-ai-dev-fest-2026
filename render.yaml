# Render Blueprint for Sathi
# Automatic multi-service deployment: Managed Postgres, FastAPI Backend, React Console
version: "1"

databases:
  - name: sathi-db
    databaseName: sathi
    user: sathi
    plan: free
    region: oregon

services:
  - type: web
    name: sathi-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -c backend/requirements-dev.lock -r backend/requirements.txt"
    startCommand: "PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        fromDatabase:
          name: sathi-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://sathi-console.onrender.com,http://localhost:13000,http://127.0.0.1:13000"
      - key: SATHI_CONFIG
        value: "data/config.yaml"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: sathi-console
    runtime: static
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend ci && npm --prefix frontend run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
